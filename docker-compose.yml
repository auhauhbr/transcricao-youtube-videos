services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: app
        env_file: .env
        volumes:
            - ./.env:/var/www/html/.env:ro
            - ./app:/var/www/html/app
            - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
            - ./config:/var/www/html/config
            - ./database:/var/www/html/database
            - ./public:/var/www/html/public
            - ./resources:/var/www/html/resources
            - ./routes:/var/www/html/routes
            - ./tests:/var/www/html/tests
            - ./phpunit.xml:/var/www/html/phpunit.xml
            - vendor_data:/var/www/html/vendor
            - storage_data:/var/www/html/storage
            - cache_data:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:1.29-alpine
        ports:
            - "8000:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: worker
        user: www-data
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        env_file: .env
        volumes:
            - ./.env:/var/www/html/.env:ro
            - ./app:/var/www/html/app
            - ./bootstrap/app.php:/var/www/html/bootstrap/app.php
            - ./config:/var/www/html/config
            - ./database:/var/www/html/database
            - ./public:/var/www/html/public
            - ./resources:/var/www/html/resources
            - ./routes:/var/www/html/routes
            - ./tests:/var/www/html/tests
            - ./phpunit.xml:/var/www/html/phpunit.xml
            - vendor_data:/var/www/html/vendor
            - storage_data:/var/www/html/storage
            - cache_data:/var/www/html/bootstrap/cache
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-transcricoes}
            POSTGRES_USER: ${DB_USERNAME:-transcricoes}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-transcricoes}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-transcricoes} -d ${DB_DATABASE:-transcricoes}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    cache_data:
    postgres_data:
    redis_data:
    storage_data:
    vendor_data:
